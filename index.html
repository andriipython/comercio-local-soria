<head>

  <style>
    :root {
      --primary: #991b1b;
      --primary-dark: #7f1d1d;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --accent-osm: #15803d;
      --accent-osm-hover: #166534;
      --radius: 12px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.07), 0 2px 4px -2px rgba(0,0,0,0.05);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -4px rgba(0,0,0,0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* Header Design */
    header {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      color: white;
      padding: 48px 20px;
      text-align: center;
      border-bottom: 4px solid var(--primary);
    }

    .header-tag {
      display: inline-block;
      background: rgba(255, 255, 255, 0.1);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 12px;
      color: #fca5a5;
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    header p {
      color: #94a3b8;
      font-size: 1.05rem;
      max-width: 580px;
      margin: 0 auto;
    }

    /* Container */
    .container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 32px 20px 60px;
    }

    /* Search & Filter Bar */
    .filter-bar {
      background: var(--surface);
      padding: 16px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 24px;
    }

    .search-box {
      flex: 1;
      min-width: 260px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 10px 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-box input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(153, 27, 27, 0.1);
    }

    .select-category {
      padding: 10px 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      background-color: var(--surface);
      outline: none;
      cursor: pointer;
    }

    .results-count {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-left: auto;
      font-weight: 500;
    }

    /* Grid Layout */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 24px;
    }

    /* Card Styling */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-sm);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
    }

    .card-img-wrapper {
      position: relative;
      width: 100%;
      height: 190px;
      background-color: #f1f5f9;
      overflow: hidden;
    }

    .card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .card:hover .card-img {
      transform: scale(1.03);
    }

    .card-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(4px);
      color: white;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .card-content {
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
    }

    .card-desc {
      font-size: 0.92rem;
      color: var(--text-muted);
      margin-bottom: 16px;
      flex-grow: 1;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-address {
      font-size: 0.85rem;
      color: #475569;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
    }

    .card-actions {
      display: flex;
      gap: 8px;
      margin-top: auto;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 14px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      flex: 1;
      transition: background-color 0.2s;
    }

    .btn-osm {
      background-color: var(--accent-osm);
      color: white;
    }
    .btn-osm:hover {
      background-color: var(--accent-osm-hover);
    }

    .btn-web {
      background-color: #f1f5f9;
      color: #334155;
      border: 1px solid var(--border);
    }
    .btn-web:hover {
      background-color: #e2e8f0;
    }

    /* Empty State */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    footer {
      text-align: center;
      padding: 24px;
      font-size: 0.85rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
      background: white;
    }
  </style>
</head>

    // Función principal para dibujar los comercios
    function render(items) {
      const grid = document.getElementById('grid');
      const countEl = document.getElementById('resultsCount');
      grid.innerHTML = '';

      countEl.textContent = `${items.length} ${items.length === 1 ? 'comercio' : 'comercios'}`;

      if (items.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <p>No se encontraron comercios que coincidan con tu búsqueda.</p>
          </div>
        `;
        return;
      }

      const imgPlaceholder = 'https://images.unsplash.com/photo-1534723452862-4c874018d66d?auto=format&fit=crop&w=600&q=80';

      items.forEach(item => {
        const card = document.createElement('article');
        card.className = 'card';

        card.innerHTML = `
          <div class="card-img-wrapper">
            <span class="card-badge">${item.categoriaEtiqueta}</span>
            <img class="card-img" src="${item.foto || imgPlaceholder}" alt="${item.nombre}" onerror="this.src='${imgPlaceholder}'" loading="lazy">
          </div>
          <div class="card-content">
            <h2 class="card-title">${item.nombre}</h2>
            <p class="card-desc">${item.descripcion}</p>
            <div class="card-address">
              📍 ${item.direccion}
            </div>
            <div class="card-actions">
              ${item.osmUrl ? `<a href="${item.osmUrl}" target="_blank" rel="noopener" class="btn btn-osm">🗺️ Ver mapa</a>` : ''}
              ${item.webUrl ? `<a href="${item.webUrl}" target="_blank" rel="noopener" class="btn btn-web">🌐 Sitio Web</a>` : ''}
            </div>
          </div>
        `;

        grid.appendChild(card);
      });
    }

    // Filtrado en tiempo real
    function filterData() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const cat = document.getElementById('categoryFilter').value;

      const filtered = comercios.filter(item => {
        const matchesText = item.nombre.toLowerCase().includes(query) ||
                            item.descripcion.toLowerCase().includes(query) ||
                            item.direccion.toLowerCase().includes(query);
        const matchesCat = (cat === 'todas') || (item.categoria === cat);

        return matchesText && matchesCat;
      });

      render(filtered);
    }

    document.getElementById('searchInput').addEventListener('input', filterData);
    document.getElementById('categoryFilter').addEventListener('change', filterData);

    // Carga inicial al abrir la página
    render(comercios);
  </script>
